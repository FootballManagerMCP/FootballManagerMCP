services:
  seq:
    image: datalust/seq:latest
    # Bound to this machine only: Seq runs without authentication.
    ports:
      - "127.0.0.1:5342:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    restart: unless-stopped

  footballmanager-api:
    build:
      context: ./src
      dockerfile: FootballManager/FootballManager.Api/Dockerfile
    # Bound to this machine only: the API has no authentication and changes the game.
    ports:
      - "127.0.0.1:5120:8080"
    # Football Manager runs on the host; its plugin only answers requests addressed to localhost.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - InfrastructureSettings__GameBridgeBaseUrl=http://host.docker.internal:5121
      - InfrastructureSettings__GameBridgeHostHeader=localhost:5121
      - Seq__ServerUrl=http://seq:80
    restart: unless-stopped
